<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#16201a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f3ee" media="(prefers-color-scheme: light)">
  <title>Matchup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      const t = JSON.parse(localStorage.getItem('fms:v2') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
    <a class="brand" href="./" aria-label="Matchup home">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><ellipse cx="11" cy="11" rx="10" ry="6.2" transform="rotate(-35 11 11)" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 11.6 14 10.4M9.6 9.4l.6 1.6M11 9.1l.6 1.6M12.4 8.8l.6 1.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Matchup</span>
    </a>

    <div class="topbar-controls" id="controls" hidden>
      <label class="select-wrap" id="league-wrap">
        <span class="sr-only">League</span>
        <select id="league-select" aria-label="League"></select>
      </label>
      <div class="week-stepper" role="group" aria-label="Week">
        <button type="button" id="week-prev" aria-label="Previous week">‹</button>
        <select id="week-select" aria-label="Week"></select>
        <button type="button" id="week-next" aria-label="Next week">›</button>
      </div>
    </div>

    <span class="topbar-live" id="topbar-live" aria-live="polite"></span>

    <div class="topbar-right">
      <button type="button" class="user-chip" id="user-chip" hidden title="Switch user"></button>
      <button type="button" class="icon-btn" id="theme-btn" aria-label="Toggle light or dark theme">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18V3z" fill="currentColor"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
    </div>
  </header>

  <div id="banner" class="banner" hidden role="status"></div>

  <main id="app">
    <!-- Rendered by app.js -->
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
